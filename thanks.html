  <title>送信ありがとうございました｜ぷれいすカレッジ</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/Favicon_16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/Favicon_32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/Favicon_48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/Favicon_180.png">
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --marigold: #f3981c;
      --marigold-dark: #d97e0a;
      --lemon: #fde839;
      --leaf: #32b372;
      --leaf-100: #d3f0e2;
      --ink-900: #232021;
      --ink-700: #5a5657;
      --ink-600: #726d6e;
      --white: #ffffff;
      --font-display: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
      --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    }
    body { background: #fffbed; font-family: var(--font-body); color: var(--ink-900); line-height: 1.9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--white); border-radius: 24px; padding: 52px 30px; max-width: 560px; width: 100%; text-align: center; box-shadow: 0 6px 18px rgba(90, 86, 87, .10); }
    .check { width: 74px; height: 74px; border-radius: 50%; background: var(--leaf-100); display: inline-flex; align-items: center; justify-content: center; }
    .check svg { width: 38px; height: 38px; stroke: var(--leaf); stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin-top: 22px; font-family: var(--font-display); font-weight: 900; font-size: 24px; }
    .msg { margin-top: 14px; font-size: 14px; color: var(--ink-700); }
    .brand { margin-top: 26px; font-family: var(--font-display); font-weight: 900; font-size: 15px; color: var(--marigold); }
    .brand small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 10px; color: var(--ink-600); letter-spacing: .18em; margin-top: 2px; }
    .home { display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 30px; background: var(--white); border: 2.5px solid var(--ink-900); border-radius: 999px; padding: 16px 34px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-900); text-decoration: none; box-shadow: 0 6px 0 var(--lemon); }
    .home:hover { transform: translateY(-2px); }
    @media (max-width: 480px) { .card { padding: 42px 22px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline points="4.5 12.8 9.8 18 19.5 7"></polyline></svg></span>
    <h1>送信ありがとうございました</h1>
    <p class="msg">お申し込みを受け付けました。<br>担当者より折り返しご連絡いたしますので、<br>今しばらくお待ちください。</p>
    <p class="brand">ぷれいすカレッジ<small>PLACE COLLEGE</small></p>
    <a class="home" href="/">トップページへ戻る</a>
  </main>
</body>
</html>
